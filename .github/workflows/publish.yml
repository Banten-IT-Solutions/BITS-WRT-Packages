name: 📦 Publish Feed

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release-update]

permissions:
  contents: write

concurrency:
  group: bits-feed-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 📦 Publish Feed
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v7

      - name: ⬇️ Fetch Packages
        run: |
          mkdir -p feed
          for repo in BITS-Networks-Bot BITS-Tailscale BITS-Theme; do
            gh release download --repo "Banten-IT-Solutions/$repo" --pattern '*.ipk' --dir feed --clobber || true
            gh release download --repo "Banten-IT-Solutions/$repo" --pattern '*.apk' --dir feed --clobber || true
          done
          ls -la feed/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build opkg Index
        run: |
          chmod +x mkindex.sh
          ./mkindex.sh feed

      - name: 🏗️ Build apk Index
        run: |
          APK_VER="3.0.8-r0"
          curl -sL -o /tmp/apk-tools-static.apk \
            "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/apk-tools-static-${APK_VER}.apk"
          tar xzf /tmp/apk-tools-static.apk -C /tmp sbin/apk.static 2>/dev/null
          (cd feed && /tmp/sbin/apk.static mkndx --allow-untrusted --output packages.adb *.apk)
          ls -la feed/

      - name: 🔐 Sign opkg Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq signify-openbsd
          BLOB=$(printf '%s' "$FEED_SIGN_BLOB" | tr -d ' \t\r\n')
          printf 'untrusted comment: BITS-WRT-Packages opkg feed signing key\n%s\n' "$BLOB" > /tmp/feed.sec
          chmod 600 /tmp/feed.sec
          signify-openbsd -S -s /tmp/feed.sec -m feed/Packages
          ls -la feed/Packages*
        env:
          FEED_SIGN_BLOB: ${{ secrets.FEED_SIGN_BLOB }}

      - name: 🖼️ Landing Page
        run: cp landing/index.html feed/index.html

      - name: 🚀 Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./feed